<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 850" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="850" fill="#f6f7f9"/>
  <text x="24" y="36" font-size="24" font-weight="bold" fill="#0f172a">Fire Logger — Mac mini · System Architecture</text>
  <text x="24" y="58" font-size="13.5" fill="#475569">Albertson Fire Department — dispatch audio from the radio to the dashboard · Phase 2 (dashboard upload) live Nov 22, 2026</text>

  <!-- ============ ZONE A : AUDIO PATH ============ -->
  <rect x="24" y="76" width="1192" height="118" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="100" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#64748b">1 · AUDIO PATH — AT THE RADIO</text>

  <g font-size="12" fill="#334155">
    <rect x="44" y="110" width="196" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="142" y="136" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">Motorola radio</text>
    <text x="142" y="156" text-anchor="middle">sits on the base, always on</text>

    <rect x="284" y="110" width="196" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="382" y="136" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">Minitor amplified base</text>
    <text x="382" y="156" text-anchor="middle">rear jack — fixed level</text>

    <rect x="524" y="110" width="196" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="622" y="136" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">Sabrent AU-MMSA</text>
    <text x="622" y="156" text-anchor="middle">pink mic jack · high gain</text>

    <rect x="764" y="110" width="196" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="862" y="136" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">USB → Mac mini</text>
    <text x="862" y="156" text-anchor="middle">“USB Audio Device” · 48 kHz</text>

    <rect x="1004" y="110" width="196" height="62" rx="8" fill="#fff7ed" stroke="#d97706"/>
    <text x="1102" y="136" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">Mac-side input level</text>
    <text x="1102" y="156" text-anchor="middle">macOS Sound → Input</text>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="242" y1="141" x2="280" y2="141" marker-end="url(#arr)"/>
    <line x1="482" y1="141" x2="520" y2="141" marker-end="url(#arr)"/>
    <line x1="722" y1="141" x2="760" y2="141" marker-end="url(#arr)"/>
    <line x1="962" y1="141" x2="1000" y2="141" marker-end="url(#arr)"/>
  </g>

  <!-- ============ ZONE B : MAC ============ -->
  <rect x="24" y="218" width="676" height="342" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="242" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#64748b">2 · ON THE MAC MINI — RUNS 24/7 (LAUNCHD + CAFFEINATE)</text>

  <g font-size="12" fill="#334155">
    <rect x="48" y="258" width="290" height="80" rx="8" fill="#eef4ff" stroke="#5aa9ff"/>
    <text x="64" y="282" font-size="14.5" font-weight="bold" fill="#0f172a">recorder.py — VOX recorder</text>
    <text x="64" y="302">RMS 500 starts · 3 s silence stops · 90 s cap</text>
    <text x="64" y="320">clips under 1 s discarded · upload built in</text>

    <rect x="48" y="354" width="290" height="80" rx="8" fill="#eef4ff" stroke="#5aa9ff"/>
    <text x="64" y="378" font-size="14.5" font-weight="bold" fill="#0f172a">transcriber.py — Whisper large</text>
    <text x="64" y="398">large v3 · warm MLX · vocab prompt</text>
    <text x="64" y="416">v5 rescue ladder for tone collapse</text>

    <rect x="48" y="450" width="290" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <text x="64" y="474" font-size="14.5" font-weight="bold" fill="#0f172a">cleanup — Ollama</text>
    <text x="64" y="494">qwen2.5:14b · CAD-anchored</text>
    <text x="64" y="512">digit-check: numbers trace to raw/CAD</text>
    <rect x="238" y="458" width="92" height="18" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="284" y="471" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">TEST PENDING</text>

    <rect x="362" y="258" width="314" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="378" y="282" font-size="14.5" font-weight="bold" fill="#0f172a">clips/</text>
    <text x="378" y="302">WAV master + MP3 per clip</text>
    <text x="378" y="320">a .txt + .whisper.json beside each clip</text>

    <rect x="362" y="354" width="314" height="80" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="378" y="378" font-size="14.5" font-weight="bold" fill="#0f172a">config.json</text>
    <text x="378" y="398">upload_enabled · Supabase project URL</text>
    <text x="378" y="416" font-weight="bold" fill="#b91c1c">the secret key lives ONLY on this Mac</text>
  </g>
  <line x1="340" y1="298" x2="358" y2="298" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="660" y1="352" x2="660" y2="342" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="520" y="349" text-anchor="middle" font-size="11" fill="#475569">transcriber reads WAVs · writes .txt back</text>

  <!-- ============ ZONE C : SUPABASE ============ -->
  <rect x="724" y="218" width="492" height="342" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="744" y="242" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#64748b">3 · SUPABASE — DASHBOARD PROJECT</text>

  <g font-size="12" fill="#334155">
    <rect x="748" y="258" width="444" height="72" rx="8" fill="#f0fdf4" stroke="#15803d"/>
    <text x="764" y="282" font-size="14.5" font-weight="bold" fill="#0f172a">incidents</text>
    <text x="764" y="302">the CAD record — ground truth for time-matching</text>
    <text x="764" y="318">fed by Nassau County CAD email (cad-ingest)</text>

    <rect x="748" y="346" width="444" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="764" y="370" font-size="14.5" font-weight="bold" fill="#0f172a">dispatch-audio bucket</text>
    <text x="764" y="390">the MP3 files · public read</text>

    <rect x="748" y="426" width="444" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="764" y="450" font-size="14.5" font-weight="bold" fill="#0f172a">radio_clips</text>
    <text x="764" y="470">started_at · storage_path · public_url</text>
    <text x="764" y="486">transcript_raw / transcript_clean — stored, not displayed</text>
    <text x="764" y="500">anon read · writes only from the Mac</text>
  </g>

  <!-- upload flow B -> C -->
  <line x1="678" y1="378" x2="744" y2="378" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="711" y="366" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">MP3 + row</text>
  <text x="711" y="398" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">LIVE</text>

  <!-- future flow -->
  <line x1="340" y1="530" x2="744" y2="530" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
  <text x="542" y="520" text-anchor="middle" font-size="11.5" fill="#64748b">phase 2b — transcript upload from the transcriber (not built)</text>

  <!-- ============ ZONE D : DASHBOARD ============ -->
  <line x1="970" y1="562" x2="970" y2="592" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="982" y="582" font-size="11.5" fill="#475569">anon read</text>

  <rect x="24" y="596" width="1192" height="168" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="620" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#64748b">4 · FIREHOUSE DASHBOARD — GITHUB PAGES</text>

  <g font-size="12" fill="#334155">
    <rect x="48" y="636" width="368" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="64" y="660" font-size="14.5" font-weight="bold" fill="#0f172a">Fetches incidents + radio_clips</text>
    <text x="64" y="680">refresh cycle · missing table = silent no-op</text>

    <rect x="436" y="636" width="368" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="452" y="660" font-size="14.5" font-weight="bold" fill="#0f172a">Time-match: −60 s / +4 min</text>
    <text x="452" y="680">nearest dispatch wins · unmatched clips hidden</text>

    <rect x="824" y="636" width="368" height="66" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="840" y="660" font-size="14.5" font-weight="bold" fill="#0f172a">Call detail: the player pill</text>
    <text x="840" y="680">play/pause + stop · seek bar · time readout</text>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="418" y1="669" x2="432" y2="669" marker-end="url(#arr)"/>
    <line x1="806" y1="669" x2="820" y2="669" marker-end="url(#arr)"/>
  </g>
  <text x="44" y="732" font-size="12.5" fill="#475569">No autoplay — a person presses play. Transcripts are held back from the UI until cleanup quality proves out; the audio is the record.</text>
  <text x="44" y="752" font-size="12.5" fill="#475569">Every dispatch airs twice (tones → message → tones → the same message re-read live), so most calls show two pills: Airing 1 and Airing 2.</text>

  <text x="24" y="800" font-size="12" fill="#64748b">Solid arrows are live today. Dashed = designed, not built. The old Pi logger’s keys were exposed in a chat and are never reused — this system’s key exists only in the Mac’s config.json.</text>
  <text x="24" y="820" font-size="12" fill="#64748b">Repo: github.com/hwangnyc/fire-logger-mac · Dashboard: hwangnyc.github.io/albertson-fire-dashboard</text>
</svg>
